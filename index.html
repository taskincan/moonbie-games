<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonbie Games</title>
<meta name="description" content="Moonbie Games — small pixel-art games.">
<style>
  :root { --bg: #f6f1e4; --fg: #2a2118; --muted: #6b5d4c; --accent: #5e9a3a; --rule: #ddd2bb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1913; --fg: #ece3d0; --muted: #b3a58e; --accent: #9cbc72; --rule: #3a3227; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.8rem; line-height: 1.25; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  img { max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 8px; display: block; }
  .game { display: flex; gap: 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--rule); }
  .game img { width: 72px; height: 72px; border-radius: 16px; flex: none; }
</style>
</head>
<body>
<main>
<h1>Moonbie Games</h1>
<p class="muted">Small pixel-art games. Contact: <a href="mailto:moonbiegames@gmail.com">moonbiegames@gmail.com</a></p>
<div class="game">
  <img src="branchs-journey/icon.png" alt="The Branch's Journey icon">
  <div><a href="branchs-journey/"><strong>The Branch's Journey</strong></a> <span class="muted">(Dalın Yolculuğu)</span><br>
  <span class="muted">A pixel platformer through four seasons · <a href="branchs-journey/privacy/">Privacy policy</a></span></div>
</div>
</main>
</body>
</html>
